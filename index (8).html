  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ight:500; letter-spacing:.16em; text-transform:uppercase; color:rgba(233,233,237,.45);\">Turma Ômega · 2026<\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"max-width:1280px; margin:0 auto; padding:clamp(72px, 11vw, 150px) clamp(22px, 4vw, 48px) clamp(80px, 9vw, 130px);\">\n    <h1 style=\"font-family:'Instrument Serif', serif; font-weight:400; font-size:clamp(38px, 4.6vw, 68px); line-height:1.02; letter-spacing:-.008em; margin:0; max-width:11ch; color:#f4f2fc;\">Monica Helena Moreira Pires<\u002Fh1>\n    <div style=\"width:72px; height:1px; background:#9184d9; margin:clamp(30px, 3.4vw, 46px) 0 clamp(26px, 3vw, 38px);\"><\u002Fdiv>\n    <div style=\"font-size:clamp(13px, 1.1vw, 15px); font-weight:500; letter-spacing:.28em; text-transform:uppercase; color:#d2cefd; margin-bottom:20px;\">A mentoria · da matrícula ao registro<\u002Fdiv>\n    <p style=\"font-family:'Instrument Serif', serif; font-size:clamp(20px, 1.8vw, 27px); line-height:1.3; color:rgba(233,233,237,.9); max-width:30ch; margin:0;\">o jurídico da compra e venda de alto padrão, do começo ao fim<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:clamp(36px, 5vw, 80px); margin-top:clamp(52px, 6vw, 84px); align-items:end;\">\n      <p style=\"font-size:clamp(19px, 1.65vw, 22px); line-height:1.5; font-weight:400; color:rgba(233,233,237,.86); max-width:46ch; margin:0;\">Você já sabe vender o imóvel e conquistar a confiança do cliente. Agora quer dominar a técnica e conduzir cada etapa, da matrícula ao registro, sabendo exatamente o que está fazendo.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:18px; align-items:flex-start;\">\n        <div style=\"display:grid; grid-template-columns:auto 1fr; gap:8px 26px; font-size:15px; line-height:1.5;\">\n          <span style=\"color:rgba(233,233,237,.42);\">quando<\u002Fspan><span style=\"color:#f4f2fc;\">25 de agosto a 8 de outubro<\u002Fspan>\n          <span style=\"color:rgba(233,233,237,.42);\">encontros<\u002Fspan><span style=\"color:#f4f2fc;\">14 · terças e quintas, 8h<\u002Fspan>\n          <span style=\"color:rgba(233,233,237,.42);\">formato<\u002Fspan><span style=\"color:#f4f2fc;\">Ao vivo, mais 1 imersão presencial<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:16px; font-size:15px; line-height:1.55; color:rgba(233,233,237,.5); max-width:34ch;\">Leia a página inteira. Como se candidatar está no final.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1280px; margin:0 auto; padding:0 clamp(22px, 4vw, 48px) clamp(90px, 11vw, 160px);\">\n    <div style=\"display:flex; flex-wrap:wrap; gap:clamp(28px, 5vw, 80px); align-items:flex-start;\">\n      <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; position:sticky; top:40px; flex:0 1 260px;\">{ o que você vai aprender }<\u002Fdiv>\n      <div style=\"flex:1 1 460px; min-width:0;\">\n        <p style=\"font-size:clamp(19px, 1.6vw, 21px); line-height:1.6; color:rgba(233,233,237,.7); max-width:44ch; margin:0 0 clamp(40px, 4vw, 56px);\">Tudo isto faz parte de uma compra e venda de um imóvel. Se você reconhece esse mundo e quer dominá-lo do começo ao fim, este é o seu lugar.<\u002Fp>\n        <p style=\"font-family:'Instrument Serif', serif; font-size:clamp(17px, 1.5vw, 21px); line-height:1.95; color:rgba(233,233,237,.72); margin:0; text-wrap:pretty;\">matrícula · averbação · registro · escritura · proposta · compromisso · due diligence · instrumento particular com força de escritura pública · hipoteca · escritura com cláusula resolutiva · posse antecipada · irrevogável e irretratável · indisponibilidade · penhora · alienação fiduciária · interveniente quitante · financiamento · consórcio · FGTS · ITBI · valor venal de referência · custas · comissão · regime de bens · inventário · divórcio · procuração · posse · registro de imóveis · tabelionato · certidão · processo judicial<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-top:1px solid rgba(145,132,217,.14);\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:clamp(90px, 11vw, 150px) clamp(22px, 4vw, 48px) clamp(90px, 11vw, 150px);\">\n      <div style=\"display:flex; flex-wrap:wrap; gap:clamp(28px, 5vw, 80px); align-items:flex-start;\">\n        <div style=\"position:sticky; top:40px; flex:0 1 260px;\">\n          <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; margin-bottom:20px;\">{ conteúdo programático }<\u002Fdiv>\n          <div style=\"font-size:15px; line-height:1.6; color:rgba(233,233,237,.5);\">Quatorze encontros, na ordem em que a operação acontece.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1 1 460px; min-width:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap:0 clamp(32px, 4vw, 56px);\">\n          <sc-for list=\"{{ aulas }}\" as=\"a\" hint-placeholder-count=\"14\">\n            <div style=\"padding:clamp(22px, 2.2vw, 30px) 0; border-top:1px solid rgba(145,132,217,.14);\">\n              <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:12px;\">\n                <div style=\"font-family:'Instrument Serif', serif; font-size:24px; line-height:1; color:#9184d9;\">{{ a.n }}<\u002Fdiv>\n                <div style=\"font-size:14px; color:rgba(233,233,237,.42); letter-spacing:.02em;\">{{ a.data }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:clamp(19px, 1.5vw, 22px); font-weight:500; line-height:1.2; color:#f4f2fc;\">{{ a.t }}<\u002Fdiv>\n              <div style=\"font-size:16px; line-height:1.55; color:rgba(233,233,237,.6); margin-top:9px;\">{{ a.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1280px; margin:0 auto; padding:0 clamp(22px, 4vw, 48px) clamp(90px, 11vw, 150px);\">\n    <div style=\"background:#262a60; border-radius:10px; padding:clamp(30px, 6vw, 88px);\">\n      <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#d2cefd; margin-bottom:clamp(36px, 4vw, 56px);\">{ como será o curso }<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:clamp(34px, 4vw, 56px);\">\n        <sc-for list=\"{{ formato }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div>\n            <div style=\"font-size:19px; font-weight:500; line-height:1.25; color:#f4f2fc;\">{{ f.t }}<\u002Fdiv>\n            <div style=\"font-size:16px; line-height:1.55; color:rgba(233,233,237,.72); margin-top:10px;\">{{ f.d }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"height:1px; background:rgba(210,206,253,.2); margin:clamp(44px, 5vw, 68px) 0;\"><\u002Fdiv>\n      <p style=\"font-family:'Instrument Serif', serif; font-style:italic; font-size:clamp(22px, 2vw, 29px); line-height:1.3; color:#f4f2fc; max-width:28ch; margin:0 0 24px;\">Uma hora inteira para se conectar.<\u002Fp>\n      <p style=\"font-size:clamp(18px, 1.5vw, 20px); line-height:1.6; color:rgba(233,233,237,.82); max-width:54ch; margin:0;\">As aulas não ficam gravadas. É a sua hora com o mundo jurídico da compra e venda, com a turma e comigo, sem nada disputando a sua atenção. Deixe o WhatsApp e o Instagram para depois das nove e meia.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"candidatura\" style=\"max-width:1280px; margin:0 auto; padding:0 clamp(22px, 4vw, 48px) clamp(90px, 11vw, 150px);\">\n    <div style=\"display:flex; flex-wrap:wrap; gap:clamp(28px, 5vw, 80px); align-items:flex-start;\">\n      <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; position:sticky; top:40px; flex:0 1 260px;\">{ investimento }<\u002Fdiv>\n      <div style=\"flex:1 1 460px; min-width:0;\">\n        <div style=\"display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:28px;\">\n          <div style=\"font-family:'Instrument Serif', serif; font-size:clamp(46px, 5.4vw, 78px); line-height:.9; color:#f4f2fc;\">R$ 12.000<\u002Fdiv>\n          <div style=\"font-size:15px; color:rgba(233,233,237,.45);\">valor da mentoria<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family:'Instrument Serif', serif; font-style:italic; font-size:clamp(23px, 2.1vw, 31px); line-height:1.2; color:#d2cefd; max-width:20ch; margin:0 0 32px;\">Nesta turma, todas as vagas são bolsa integral.<\u002Fp>\n        <p style=\"font-size:clamp(18px, 1.5vw, 20px); line-height:1.6; color:rgba(233,233,237,.7); max-width:50ch; margin:0 0 clamp(52px, 6vw, 80px);\">A Ômega é a turma em que eu testo o formato. Metade das vagas vou destinar a corretores da Jardins, a imobiliária que meu escritório assessora. A outra metade escolherei entre corretores por indicação.<\u002Fp>\n\n        <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; margin-bottom:32px;\">{ a entrada }<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:clamp(24px, 3vw, 40px);\">\n          <sc-for list=\"{{ etapas }}\" as=\"e\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid rgba(145,132,217,.3); padding-top:20px;\">\n              <div style=\"font-family:'Instrument Serif', serif; font-size:22px; color:#9184d9; line-height:1; margin-bottom:14px;\">{{ e.n }}<\u002Fdiv>\n              <div style=\"font-size:18px; font-weight:500; line-height:1.25; color:#f4f2fc;\">{{ e.t }}<\u002Fdiv>\n              <div style=\"font-size:15px; line-height:1.5; color:rgba(233,233,237,.6); margin-top:8px;\">{{ e.d }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <a href=\"https://wa.me/5511981119489?text=Oi%20Monica!%20Vi%20a%20p%C3%A1gina%20da%20Turma%20%C3%94mega%20e%20queria%20saber%20mais.\" style=\"display:inline-flex; align-items:center; margin-top:clamp(40px, 4vw, 56px); padding:16px 38px; background:#9184d9; border-radius:999px; color:#0c0e17; font-size:15px; font-weight:600; letter-spacing:.02em;\" style-hover=\"background:#d2cefd\">Quero me candidatar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1280px; margin:0 auto; padding:0 clamp(22px, 4vw, 48px) clamp(90px, 11vw, 150px);\">\n    <div style=\"display:flex; flex-wrap:wrap; gap:clamp(28px, 5vw, 80px); align-items:flex-start;\">\n      <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; position:sticky; top:40px; flex:0 1 260px;\">{ perguntas frequentes }<\u002Fdiv>\n      <div style=\"flex:1 1 460px; min-width:0; max-width:760px;\">\n        <sc-for list=\"{{ faq }}\" as=\"f\" hint-placeholder-count=\"8\">\n          <div style=\"padding:clamp(24px, 2.4vw, 32px) 0; border-top:1px solid rgba(145,132,217,.14);\">\n            <div style=\"font-size:clamp(19px, 1.6vw, 21px); font-weight:500; line-height:1.3; color:#f4f2fc;\">{{ f.q }}<\u002Fdiv>\n            <div style=\"font-size:17px; line-height:1.6; color:rgba(233,233,237,.66); margin-top:12px;\">{{ f.a }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"border-top:1px solid rgba(145,132,217,.14);\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-top:1px solid rgba(145,132,217,.14);\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:clamp(90px, 11vw, 150px) clamp(22px, 4vw, 48px);\">\n      <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; margin-bottom:clamp(40px, 5vw, 64px);\">{ quem conduz }<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:clamp(40px, 6vw, 80px); align-items:start;\">\n        <div style=\"border-radius:10px; overflow:hidden; max-width:400px;\">\n          <img src=\"348db002-7dc6-495a-9a79-22fb5e928958\" alt=\"Monica Helena Moreira Pires\" style=\"width:100%; height:auto; display:block;\">\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-family:'Instrument Serif', serif; font-style:italic; font-weight:400; font-size:clamp(30px, 3.2vw, 44px); line-height:1.04; color:#f4f2fc; margin:0 0 clamp(32px, 4vw, 44px);\">Monica Helena Moreira Pires<\u002Fp>\n          <p style=\"font-size:clamp(18px, 1.5vw, 20px); line-height:1.6; color:rgba(233,233,237,.84); max-width:46ch; margin:0 0 22px;\">Advogada especializada em direito imobiliário, com trinta anos de formada. Acompanhei a estruturação de centenas de transações, mais de <strong style=\"font-weight:500; color:#f4f2fc;\">R$ 2 bilhões<\u002Fstrong> em compra e venda de imóveis de alto padrão.<\u002Fp>\n          <p style=\"font-size:clamp(18px, 1.5vw, 20px); line-height:1.6; color:rgba(233,233,237,.7); max-width:46ch; margin:0 0 22px;\">À frente da MHMP Consultoria Jurídica, atuo em due diligence com análise de risco, contratos personalizados e acompanhamento próximo do cliente em todas as etapas da aquisição e da alienação. A MHMP é responsável pela consultoria jurídica da Jardins&amp;Co | Forbes.<\u002Fp>\n          <p style=\"font-size:clamp(18px, 1.5vw, 20px); line-height:1.6; color:rgba(233,233,237,.7); max-width:46ch; margin:0 0 32px;\">Do lado do comprador, do vendedor e do corretor, aprendi onde os negócios emperram, e aprendi que quase sempre dá para evitar.<\u002Fp>\n          <div style=\"border-top:1px solid rgba(145,132,217,.18); padding-top:26px; max-width:46ch;\">\n            <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; margin-bottom:16px;\">{ formação }<\u002Fdiv>\n            <div style=\"font-size:16px; line-height:1.7; color:rgba(233,233,237,.62);\">Especialista em Direito Imobiliário pela Faculdade Baiana de Direito. Direito Processual Civil pela PUC-SP. Direito Constitucional pelo CEEU. Due Diligence Imobiliário pelo Centro de Conhecimento 3C. Teoria e Prática da Regularização de Imóveis, Método Chezzi. Membro da comissão de negócios imobiliários do IBRADIM.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-top:1px solid rgba(145,132,217,.14);\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:clamp(80px, 10vw, 130px) clamp(22px, 4vw, 48px);\">\n      <div style=\"font-size:13px; font-weight:500; letter-spacing:.2em; color:#9184d9; margin-bottom:36px;\">{ última chamada }<\u002Fdiv>\n      <p style=\"font-family:'Instrument Serif', serif; font-style:italic; font-size:clamp(28px, 3.2vw, 46px); line-height:1.08; color:#f4f2fc; max-width:19ch; margin:0 0 32px;\">Conduza a próxima venda de imóvel de alto padrão do começo ao fim, dominando o procedimento.<\u002Fp>\n      <p style=\"font-size:clamp(18px, 1.5vw, 20px); line-height:1.6; color:rgba(233,233,237,.66); max-width:44ch; margin:0 0 40px;\">Se você quer entender se a Ômega faz sentido para o seu momento, me manda uma mensagem no WhatsApp. Eu respondo, e a gente começa o processo de admissão por ali.<\u002Fp>\n      <a href=\"https://wa.me/5511981119489?text=Oi%20Monica!%20Vi%20a%20p%C3%A1gina%20da%20Turma%20%C3%94mega%20e%20queria%20saber%20mais.\" style=\"display:inline-flex; align-items:center; padding:16px 38px; background:#9184d9; border-radius:999px; color:#0c0e17; font-size:15px; font-weight:600;\" style-hover=\"background:#d2cefd\">Quero me candidatar<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"border-top:1px solid rgba(145,132,217,.14);\">\n    <div style=\"max-width:1280px; margin:0 auto; padding:40px clamp(22px, 4vw, 48px) 60px; display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; align-items:baseline;\">\n      <div style=\"font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:rgba(233,233,237,.45);\">Monica Helena Moreira Pires<\u002Fdiv>\n      <div style=\"font-size:13px; color:rgba(233,233,237,.35);\">Lab Conexão Imobiliária · Turma Ômega · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const rows = [\n      [\"25 ago · ter\", \"Diagnóstico e alinhamento\", \"Para onde a gente vai juntos. Perfil e objetivos da turma, a compra e venda de ponta a ponta, os atores da transação e por que o alto padrão é tão regulado por lei.\"],\n      [\"27 ago · qui\", \"O imóvel e a matrícula\", \"O documento que organiza tudo. Como ler a matrícula de uma casa e de um apartamento, o que é matrícula mãe e o que o cartório de registro de fato faz.\"],\n      [\"1 set · ter\", \"Esse imóvel vai ser vendido · I\", \"As etapas da compra e venda com recursos próprios: proposta, compromisso, documentação, escritura, registro.\"],\n      [\"2 set · qua\", \"Esse imóvel vai ser vendido · II\", \"As tensões que aparecem na proposta para além do preço: o imóvel, as pessoas, o registro, a posse e a inversão de etapas.\"],\n      [\"8 set · ter\", \"Engenharia do pagamento · I\", \"Compra e venda com financiamento bancário. Prazos reais, laudo e o cronograma que o banco impõe ao negócio.\"],\n      [\"10 set · qui\", \"Engenharia do pagamento · II\", \"Consórcio e uso de FGTS. Como cada forma de pagamento muda o caminho da transação.\"],\n      [\"15 set · ter\", \"Compromisso de compra e venda\", \"Para que serve o documento, em que momento ele entra na operação e qual é a sua estrutura básica.\"],\n      [\"17 set · qui\", \"Documentos e diligência · I\", \"Os documentos e certidões que o vendedor precisa apresentar ao comprador, e como organizar essa etapa.\"],\n      [\"22 set · ter\", \"Documentos e diligência · II\", \"Tribunais e certidões, as principais questões que aparecem na diligência imobiliária e como elas impactam a operação.\"],\n      [\"24 set · qui\", \"Comissão\", \"O que a lei e a jurisprudência dizem sobre comissão, e como o corretor se protege no dia a dia.\"],\n      [\"29 set · ter\", \"ITBI e custas · I\", \"Como funciona a base de cálculo do ITBI e das custas de cartório.\"],\n      [\"1 out · qui\", \"ITBI e custas · II\", \"O cálculo na prática, sobre casos reais, com as contas que costumam vir erradas.\"],\n      [\"6 out · ter\", \"Questões jurídicas e IA\", \"Como a inteligência artificial entra no dia a dia do corretor e os cuidados necessários com consultas jurídicas.\"],\n      [\"8 out · qui\", \"Imersão presencial\", \"Um dia inteiro juntos para discutir questões jurídicas ligadas ao dia a dia do corretor de imóveis de alto padrão, e comemorar o fim da jornada.\"]\n    ];\n    return {\n      aulas: rows.map((r, i) => ({ n: String(i + 1).padStart(2, \"0\"), data: r[0], t: r[1], d: r[2] })),\n      formato: [\n        { t: \"Terças e quintas, 8h da manhã\", d: \"De 25 de agosto a 8 de outubro. Uma hora de aula, ao vivo, no Zoom.\" },\n        { t: \"9h às 9h30, sala aberta\", d: \"Eu fico mais meia hora para aprofundar um tema ou resolver o caso que está na sua mesa.\" },\n        { t: \"Câmera aberta, participação ativa\", d: \"Turma pequena. Todo mundo fala, todo mundo pergunta.\" },\n        { t: \"Material entre os encontros\", d: \"Documentos, propostas e dinâmicas para você estudar fora da aula e chegar preparado na seguinte.\" },\n        { t: \"Imersão presencial no fim\", d: \"8 de outubro, o dia todo, para fechar a jornada juntos. Reserve a agenda.\" },\n        { t: \"Três conversas comigo\", d: \"No começo, para eu entender seu momento. No meio, para ajustar o rumo das aulas. No fim, para medir a transformação.\" },\n        { t: \"Grupo de WhatsApp da turma\", d: \"Avisos, dinâmicas e trocas durante todo o curso, direto comigo.\" },\n        { t: \"Formulários de feedback\", d: \"Distribuídos ao longo do caminho. É assim que a Ômega melhora enquanto acontece.\" }\n      ],\n      etapas: [\n        { n: \"01\", t: \"Você se candidata\", d: \"Preenche um formulário curto para eu ter um primeiro retrato de você.\" },\n        { n: \"02\", t: \"A gente conversa\", d: \"Trinta minutos ao vivo, para eu entender quem é você, em que momento está a sua carreira e se este é o seu momento de fazer a mentoria.\" },\n        { n: \"03\", t: \"Havendo encaixe, você entra\", d: \"Eu escolho pela turma, não pela ordem de chegada.\" },\n        { n: \"04\", t: \"Vaga sujeita a disponibilidade\", d: \"Turma pequena por decisão, não por escassez fabricada.\" }\n      ],\n      faq: [\n        { q: \"Preciso ter formação jurídica?\", a: \"Não. A mentoria foi desenhada para corretores. Nada aqui pressupõe faculdade de direito.\" },\n        { q: \"Será que a Ômega é pra mim?\", a: \"Leia as palavras no começo desta página. Se aquele mundo é o seu mundo e você quer dominá-lo, é pra você.\" },\n        { q: \"As aulas são gravadas?\", a: \"Não. O valor está na conversa da sala, e por isso o encontro é sempre ao vivo, com câmera aberta.\" },\n        { q: \"Preciso ficar longe do celular durante a aula?\", a: \"É o que eu peço, sim. É uma hora por dia para você se conectar com o assunto, com a turma e comigo. Quem chega inteiro aprende muito mais.\" },\n        { q: \"A imersão presencial é obrigatória?\", a: \"É o fechamento da jornada, no dia 8 de outubro, o dia todo. Reserve a agenda desde já.\" },\n        { q: \"E se eu faltar uma aula?\", a: \"Acontece. Mas a mentoria é sequencial, então quem falta muito perde o fio.\" },\n        { q: \"Por que a turma é gratuita?\", a: \"Porque é a turma em que eu testo o formato. Vocês ganham o conteúdo, eu ganho a régua.\" },\n        { q: \"O que acontece depois do curso?\", a: \"Quem conclui recebe convite para um grupo fechado de alunos e ex-alunos, onde eu sigo compartilhando vídeos e conteúdo.\" }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
